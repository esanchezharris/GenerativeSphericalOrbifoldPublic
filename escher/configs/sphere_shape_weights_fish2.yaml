# The A/B-winning carve recipe (2026-08-08) -- overlay on sphere.yaml +
# sphere_shape.yaml, replacing the CLI-flag pile of the original fish run:
#
#   python escher/main_shape.py CONF_FILE=configs/sphere_shape_weights_fish2.yaml \
#       TARGET_MASK=assets/targets/fish64/target.npy
#
# Measured on the shipped fish64 target, 1500 steps (hard IoU, checkpoint-accurate):
#   shipped carve (octa_fish2)                        0.8239
#   + achieved-area crop fix (unconditional)          0.8351
#   + corner-aware/translation alignment + tau anneal 0.8683   (sr-hard 0.8385)
# Rejected by the same A/B: wider margin framing (0.778 -- the alignment pose
# dominates and the fov-50 framing degrades it), solid-angle area matching
# (sizes the target perfectly in steradians but the realized carve loses),
# solid-angle loss weighting (no effect).

PARAM_MODE: "weights"
ORBIFOLD_CONES: [2, 3, 4]
KITE_N: 20
COTANGENT_RELATIVE_WEIGHTS: true
SHAPE_CAMERA_DISTANCE: 2.4

LR_W: 0.03
W_RANGE: 0.95
MASK_LOSS_WEIGHT: 5000.0
EQUAL_AREA_WEIGHT: 500.0
AREA_TAIL_WEIGHT: 800.0
AREA_TAIL_FRACTION: 0.05
W_REGULARIZATION: 0.02
BOUNDARY_SMOOTH_WEIGHT_W: 500.0

# The four pinned cone corners can never move; scoring alignment candidates by
# corner placement + searching translation moved all-four-outside to mostly-inside
# and was worth +0.033 hard IoU over the crop fix alone.
ALIGN_CORNER_WEIGHT: 0.2
ALIGN_TRANSLATION_SEARCH_PX: 12

# Narrow the loss band over the final 20%: hard IoU is tau-invariant, the
# gradient sharpens exactly when the residual is a thin boundary ribbon.
MASK_TAU_END: 1.5

SWEEP_RANK_METRIC: "hard"
SHAPE_STEPS: 1500
SWEEP_K: []
OUTPUT_DIR: "output/sphere_shape_fish2"
