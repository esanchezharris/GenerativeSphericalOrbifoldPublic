# Deterministic planar shape phase (main_shape_planar.py) -- overlay on base.yaml.
# Full-mesh deformation (all edge weights through the planar orbifold-Tutte solve)
# against a fixed silhouette target: the GEM mechanism with a deterministic signal.

# Torus (translations only): NO pinned corners, so the whole boundary is free to
# become the figure. OrbifoldI (442) was the first choice and hit its structural
# ceiling immediately: its four pinned corners force the tile to reach into all four
# square corners forever, capping IoU at ~0.68 against a figure that covers none.
TILING_TYPE: "Torus"
MESH_RESOLUTION: 50

TARGET_MASK: "assets/targets/gingerbread/target.npy"   # same target as the sphere
MASK_LOSS_WEIGHT: 5000.0     # sphere-calibrated prior; recalibrate by short probe
MASK_PYRAMID_LEVELS: 7
MASK_TAU: 3.0
RENDER_SIZE: 512
# The frame shows [-h, h]^2. OrbifoldI pins its corners at (+-1, +-1); 2.4 leaves the
# limbs room to grow into the residual (the tile-fills-frame framing measured as the
# flat-loss culprit sphere-side transfers directly).
PLANAR_FRAME_HALF_WIDTH: 2.4

SHAPE_STEPS: 600
LR_SHAPE: 0.03
W_REGULARIZATION: 0.02
# Anti-tendril terms (measured: without them the boundary grows hairy spikes into the
# target's soft band -- perimeter 8 -> 13.3 by step 100 with static IoU). The perimeter
# hinge only charges for length BEYOND the undeformed tile's; drift keeps faces near
# their initial areas, the planar twin of the sphere's equal-area barrier.
PERIMETER_WEIGHT: 100.0
# The figure's outline is legitimately longer than the square; hinging at exactly
# perimeter0 froze the run at IoU 0.685. Free growth up to 1.6x, expensive beyond.
PERIMETER_SLACK: 1.6
# Anti-tendril, both proven sphere-side: second differences kill hairs specifically,
# the top-5% area tail punishes the slivers behind them (the MEAN dilutes to nothing).
# Smoothness calibrated by bracketing: 5000 froze a rounded square at IoU 0.707 (lobes
# unaffordable); 0 grew hairs. 500 with the gentler LR is the measured middle.
BOUNDARY_SMOOTH_WEIGHT_2D: 500.0
EQUAL_AREA_WEIGHT_2D: 50.0
AREA_TAIL_WEIGHT_2D: 200.0
SEED: 0

DEVICE: "cpu"                # the solve is CPU; cuda only accelerates the mask field
OUTPUT_DIR: "output/planar_shape"
VISUALIZATION_FREQ: 25
