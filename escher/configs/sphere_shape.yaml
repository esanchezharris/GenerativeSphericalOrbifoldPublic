# Deterministic shape phase (main_shape.py) -- merged ON TOP of sphere.yaml.
# No diffusion model is loaded; the outline is driven by a fixed target mask.

# The mask from make_target.py (npy or png; npy is the chosen candidate).
TARGET_MASK: "assets/targets/gingerbread/target.npy"
# The tile's area is PINNED (the tiling must cover 4pi, so each tile owns 4pi/|G|); a
# smaller aligned target caps IoU at target_area/tile_area structurally. Area-matched
# alignment lifts the cap (measured: the free-scale planar carve converged to exactly
# its area ratio, 0.71).
MATCH_TILE_AREA: true

# Calibrated by grid at the fixed framing (120-step probes, ~20 s each): weight 5000
# with softened chain regs climbs IoU 0.695 -> 0.75 and perim to ~1.18 with ZERO folds
# and zero reverts; 1000 barely moves, 10000 gains nothing and starts reverting. The
# chain weights below override sphere.yaml's SDS-noise-calibrated values: against a
# deterministic, smooth target the damping is mostly redundant.
MASK_LOSS_WEIGHT: 5000.0
MASK_PYRAMID_LEVELS: 7
# Soft-edge width of the analytic silhouette, in pixels. Gradients live in this band;
# the pyramid extends their reach (7 levels: 512 -> 8).
MASK_TAU: 3.0
BOUNDARY_SMOOTH_WEIGHT: 300.0
BOUNDARY_SPACING_WEIGHT: 1000.0
LR_BOUNDARY: 0.01

# Steps are a solve + one raster (no UNet): hundreds of steps run in minutes.
SHAPE_STEPS: 400

# NOT the SDS isolated distance (1.7): there the tile fills the frame, which is good
# for SDS and fatal for mask matching -- the aligned figure blows up into a frame-
# filling blob (measured: alignment scale 2.0, IoU 0.876 vs a blob, near-flat loss).
# The tile must sit INSIDE the frame with margins so the figure's limbs stay visible
# and the residual bumps give the boundary something to chase.
SHAPE_CAMERA_DISTANCE: 2.8

# Shape-phase-only framing overrides (null = RENDER_SIZE / CAMERA_FOV). The measured
# production (2,3,4) framing (d=2.4, fov=40, 512px) leaves 4.2 px of margin: the
# PINNED cone corners press the frame edge, and outline excursions past the edge are
# invisible to loss AND metric. Scaling FOV and grid together (e.g. fov 50 @ 640px)
# adds real margin at unchanged pixels-per-steradian. run_shape prints the achieved
# margin at step 0; MIN_FRAME_MARGIN_PX > 0 turns a shortfall into a hard error.
SHAPE_RENDER_SIZE: null
SHAPE_CAMERA_FOV: null
MIN_FRAME_MARGIN_PX: 0

# Area-match measure. Pixel counts are not steradians: per-pixel spherical area
# varies 2.4x across the tile at the production framing, so a pixel-matched target
# is 1.032x the tile's PINNED 4pi/|G| -- a structural hard-IoU ceiling of ~0.95
# before optimization starts. true matches the target to the tile in steradians
# (escher/pixel_solid_angle.py). The achieved-area bisection that fixes the
# compute-scale-then-crop bug (shipped fish target delivered 1.9% short) is
# unconditional either way.
SOLID_ANGLE_AREA_MATCH: false
# Weight the finest mask-loss level by per-pixel solid angle too, so the optimizer
# values coverage per steradian. Experimental; A/B separately from the alignment.
SOLID_ANGLE_LOSS_WEIGHTING: false

# Non-empty (e.g. [4, 6]) runs one shape fit per k into OUTPUT_DIR_k<k> and picks the
# winner by IoU among certificate-valid runs.
SWEEP_K: []

# true: short-carve every target_*.png candidate in TARGET_DIR and rewrite target.npy
# with whichever the tiling can actually adopt. make_target.py's own auto-pick sorts by
# figure area, which is unrelated to reachability -- and reachability is what binds
# (measured: the area-picked candidate plateaus at IoU 0.75 with the regularizers off,
# while a known-reachable target passes 0.87 within 20 steps).
SWEEP_TARGETS: false
TARGET_DIR: "assets/targets/gingerbread"
TARGET_SWEEP_STEPS: 150   # the ranking settles well before convergence
# Plausibility gate, same band make_target.py uses. Required: a candidate whose
# binarization failed and covers the frame is area-matched into a tile-shaped blob and
# then scores top IoU without deforming at all.
TARGET_AREA_MIN: 0.08
TARGET_AREA_MAX: 0.6
# Candidate screens are independent solves; 0 = min(8, cores-2). Each worker pins itself
# to one BLAS thread so the processes do not oversubscribe the machine.
TARGET_SWEEP_WORKERS: 0

# Close-then-open radius applied to the target mask before fitting, in pixels. Diffusion
# silhouettes arrive with pixel-scale jaggies (visible on the fish target's tail) and the
# carve reproduces them as sawtooth serrations on the tile outline. Keep it small -- it
# erodes genuinely thin features (a fin, a limb) before it runs out of jaggies. 0 = off.
TARGET_SMOOTH_RADIUS: 3

# Second-difference penalty on the boundary loop in WEIGHTS mode. Boundary mode has had
# its own smoothness term all along (boundary_chain_regularizers); weights mode had none
# at all, so nothing charged for a high-frequency wobble in the outline.
# Bracketed on the fish at 1500 steps (IoU / perimeter): 0 -> 0.7644 / 1.263,
# 100 -> 0.7644 / 1.221, 500 -> 0.7668 / 1.159, 2000 -> 0.7664 / 1.087. 500 is the best
# fit AND removes the serrations; by 2000 the perimeter is collapsing toward the
# undeformed tile's 1.0, i.e. the fins are being rounded off.
BOUNDARY_SMOOTH_WEIGHT_W: 500.0

OUTPUT_DIR: "output/sphere_shape"
VISUALIZATION_FREQ: 25
